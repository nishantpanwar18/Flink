<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .status-banner {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .status-healthy {
            color: #10b981;
        }
        
        .status-unhealthy {
            color: #ef4444;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .metric-label {
            color: #666;
        }
        
        .metric-value {
            font-weight: bold;
            color: #333;
        }
        
        .alert-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid;
        }
        
        .alert-critical {
            background: #fee2e2;
            border-color: #ef4444;
        }
        
        .alert-warning {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        
        .alert-info {
            background: #dbeafe;
            border-color: #3b82f6;
        }
        
        .alert-time {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .alert-message {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .alert-component {
            font-size: 0.9em;
            color: #666;
        }
        
        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 15px;
        }
        
        .timestamp {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .badge-running {
            background: #10b981;
            color: white;
        }
        
        .badge-failed {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 System Monitoring Dashboard</h1>
        
        <div class="status-banner">
            <div class="status-item">
                <div class="status-label">Overall Status</div>
                <div class="status-value" id="overall-status">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">Flink Jobs</div>
                <div class="status-value" id="flink-jobs">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">CPU Usage</div>
                <div class="status-value" id="cpu-usage">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">Memory Usage</div>
                <div class="status-value" id="memory-usage">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">Active Alerts</div>
                <div class="status-value" id="alert-count">0</div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>📊 System Resources</h2>
                <div class="chart-container">
                    <canvas id="systemChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h2>🔄 Flink Cluster</h2>
                <div id="flink-details">
                    <div class="metric-row">
                        <span class="metric-label">TaskManagers:</span>
                        <span class="metric-value" id="taskmanagers">-</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Available Slots:</span>
                        <span class="metric-value" id="available-slots">-</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Slots:</span>
                        <span class="metric-value" id="total-slots">-</span>
                    </div>
                </div>
                <div id="flink-jobs-list" style="margin-top: 15px;"></div>
            </div>
            
            <div class="card">
                <h2>📨 Kafka Topics</h2>
                <div id="kafka-topics"></div>
            </div>
            
            <div class="card">
                <h2>🚨 Recent Alerts</h2>
                <div id="alerts-list" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
        
        <div class="timestamp">
            Last updated: <span id="last-update">-</span>
        </div>
    </div>
    
    <script>
        let systemChart;
        
        function initCharts() {
            const ctx = document.getElementById('systemChart').getContext('2d');
            systemChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['CPU', 'Memory', 'Disk'],
                    datasets: [{
                        label: 'Usage %',
                        data: [0, 0, 0],
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(118, 75, 162, 0.8)',
                            'rgba(237, 100, 166, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }
        
        function updateDashboard() {
            fetch('/api/metrics')
                .then(response => response.json())
                .then(data => {
                    // Update overall status
                    const statusEl = document.getElementById('overall-status');
                    statusEl.textContent = data.overall_healthy ? 'HEALTHY' : 'UNHEALTHY';
                    statusEl.className = 'status-value ' + (data.overall_healthy ? 'status-healthy' : 'status-unhealthy');
                    
                    // Update system metrics
                    document.getElementById('cpu-usage').textContent = data.system.cpu_percent.toFixed(1) + '%';
                    document.getElementById('memory-usage').textContent = data.system.memory_percent.toFixed(1) + '%';
                    
                    // Update chart
                    systemChart.data.datasets[0].data = [
                        data.system.cpu_percent,
                        data.system.memory_percent,
                        data.system.disk_percent
                    ];
                    systemChart.update();
                    
                    // Update Flink metrics
                    document.getElementById('flink-jobs').textContent = 
                        data.flink.jobs.filter(j => j.state === 'RUNNING').length + '/' + data.flink.jobs.length;
                    document.getElementById('taskmanagers').textContent = data.flink.taskmanagers;
                    document.getElementById('available-slots').textContent = data.flink.available_slots;
                    document.getElementById('total-slots').textContent = data.flink.total_slots;
                    
                    // Update Flink jobs list
                    const jobsList = document.getElementById('flink-jobs-list');
                    jobsList.innerHTML = data.flink.jobs.map(job => `
                        <div class="metric-row">
                            <span class="metric-label">${job.name.substring(0, 30)}...</span>
                            <span class="badge ${job.state === 'RUNNING' ? 'badge-running' : 'badge-failed'}">${job.state}</span>
                        </div>
                    `).join('');
                    
                    // Update Kafka topics
                    const topicsEl = document.getElementById('kafka-topics');
                    topicsEl.innerHTML = Object.entries(data.kafka.topics).map(([topic, info]) => `
                        <div class="metric-row">
                            <span class="metric-label">${topic}</span>
                            <span class="metric-value">${info.status}</span>
                        </div>
                    `).join('');
                    
                    // Update timestamp
                    document.getElementById('last-update').textContent = new Date(data.timestamp).toLocaleString();
                })
                .catch(error => console.error('Error fetching metrics:', error));
            
            // Update alerts
            fetch('/api/alerts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('alert-count').textContent = data.count;
                    
                    const alertsList = document.getElementById('alerts-list');
                    if (data.alerts.length === 0) {
                        alertsList.innerHTML = '<p style="color: #10b981; text-align: center; padding: 20px;">No alerts</p>';
                    } else {
                        alertsList.innerHTML = data.alerts.slice().reverse().map(alert => `
                            <div class="alert-item alert-${alert.severity.toLowerCase()}">
                                <div class="alert-time">${new Date(alert.timestamp).toLocaleString()}</div>
                                <div class="alert-message">${alert.message}</div>
                                <div class="alert-component">${alert.component} - ${alert.severity}</div>
                            </div>
                        `).join('');
                    }
                })
                .catch(error => console.error('Error fetching alerts:', error));
        }
        
        // Initialize
        initCharts();
        updateDashboard();
        
        // Update every 5 seconds
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
